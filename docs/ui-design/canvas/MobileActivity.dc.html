<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#2B2F33;font-weight:400}
*{box-sizing:border-box}
a{color:#0066C0;text-decoration:none}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:#5F6770}.sm{font-size:13px}.xs{font-size:12px}
.lk{display:inline-flex;align-items:center;gap:4px;font-size:13px;background:none;border:0;padding:0;font-family:inherit;color:#0066C0;cursor:pointer;min-height:44px}
.input{min-height:44px;padding:9px 12px 9px 38px;border:1px solid #8C949C;border-radius:4px;font:inherit;font-size:14px;background:#fff;color:#2B2F33;width:100%}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px}
.tab{flex:none;min-height:40px;min-width:88px;padding:0 12px;border-radius:4px 4px 0 0;background:#4F555B;color:#fff;font:inherit;font-size:13px;border:0}
.tab[aria-selected="true"]{background:#fff;color:#2B2F33;font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 16px;border-bottom:1px solid #E6E8EB;color:#2B2F33}
.bn{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #DADDE1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:20px}
.bn a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;color:#5F6770;font-size:11px}
.bn a[aria-current="page"]{color:#0066C0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F5F7">
  <header style="height: 52px; background: #2B2F33; color: #fff; display: flex; align-items: center; padding: 0 16px">
    <span style="display: flex; align-items: center; gap: 8px" role="img" aria-label="Demo Banking">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h8.5a11 11 0 0 1 0 22H7z"></path><path d="M12 16h9"></path><path d="M17.5 12l4 4-4 4"></path></svg>
      <span style="font-size: 15px; letter-spacing: 0.04em" aria-hidden="true"><span style="font-weight: 600">DEMO</span> <span style="font-weight: 300">BANKING</span></span>
    </span>
  </header>
  <div style="background: #fff; border-bottom: 1px solid #DADDE1; min-height: 52px; display: flex; align-items: center; justify-content: center"><h1 style="font-size: 16px; font-weight: 500; margin: 0">Account activity</h1></div>
  <div style="padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="position: relative">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6770" stroke-width="1.75" aria-hidden="true" style="position: absolute; left: 12px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input class="input" type="search" aria-label="Search activity" placeholder="Search description or reference">
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span class="sm muted">Everyday · All transfer statuses</span>
      <button class="lk" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filters (1)</button>
    </div>
  </div>
  <div class="tabs" role="tablist" aria-label="Month">
    <button class="tab" role="tab" aria-selected="false" type="button">2026/08</button>
    <button class="tab" role="tab" aria-selected="false" type="button">2026/09</button>
    <button class="tab" role="tab" aria-selected="true" type="button">2026/10</button>
    <button class="tab" role="tab" aria-selected="false" type="button">2026/11</button>
  </div>
  <section style="margin: 0 12px; background: #fff; border-radius: 0 0 4px 4px; overflow: hidden" aria-label="Activity list">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
      <a class="row" href="Activity.dc.html">
        <span style="font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ r.desc }}</span>
        <span class="num" style="font-size: 14px; text-align: right; color: {{ r.color }}">{{ r.amt }}</span>
        <span class="xs muted">{{ r.date }} · {{ r.cat }}</span>
        <span class="xs" style="text-align: right; color: {{ r.stColor }}">{{ r.status }}<sc-if value="{{ r.ownedTransfer }}" hint-placeholder-val="{{ false }}"><br><span style="color:#1E7B34">Completed</span></sc-if></span>
      </a>
    </sc-for>
  </section>
  <nav class="bn" aria-label="Main">
    <a href="MobileHome.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="MobileActivity.dc.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>Activity</a>
    <a href="TransferRecipient.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>Transfer</a>
    <a href="MobileMenu.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="6" cy="6" r="1.5"></circle><circle cx="12" cy="6" r="1.5"></circle><circle cx="18" cy="6" r="1.5"></circle><circle cx="6" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle><circle cx="6" cy="18" r="1.5"></circle><circle cx="12" cy="18" r="1.5"></circle><circle cx="18" cy="18" r="1.5"></circle></svg>Menu</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Kaiten Sushi Ebisu', '31 Oct 19:41', 'Dining', '−¥4,260', 'Posted'],
      ['Lawson Ebisu 1-chome', '31 Oct 13:02', 'Groceries', '−¥648', 'Posted'],
      ['To Savings', '31 Oct 09:30', 'Transfer', '−¥50,000', 'Posted'],
      ['JR East Suica charge', '30 Oct 08:12', 'Transport', '−¥3,000', 'Posted'],
      ['Hotel Kanade Kyoto', '30 Oct 07:55', 'Travel', '−¥7,000', 'Pending'],
      ['Uniqlo Shibuya', '29 Oct 18:10', 'Shopping', '−¥3,990', 'Cancelled'],
      ['From SATO KEN', '29 Oct 06:45', 'Transfer', '+¥12,000', 'Posted']
    ].map(([desc, date, cat, amt, status]) => ({
      desc, date, cat, amt, status, ownedTransfer: desc === 'To Savings',
      color: amt.startsWith('+') ? '#1E7B34' : '#2B2F33',
      stColor: status === 'Pending' ? '#8A5A00' : '#5F6770'
    }));
    return { rows };
  }
}
</script>
</body>
</html>
