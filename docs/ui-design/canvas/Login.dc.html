<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F5F7;color:#2B2F33;font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;font-weight:400}
*{box-sizing:border-box}
a{color:#0066C0;text-decoration:none}a:hover{color:#0052A3;text-decoration:underline}
h1{margin:0;font-weight:500;font-size:20px;line-height:1.35}
p{margin:0}
.muted{color:#5F6770}.sm{font-size:13px}.xs{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:160px;padding:0 24px;border-radius:4px;font:inherit;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn-primary{background:#0066C0;color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:14px;font-weight:500}
.input{min-height:44px;padding:9px 12px;border:1px solid #8C949C;border-radius:4px;font:inherit;background:#fff;color:#2B2F33;width:100%}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#fff;padding:1px 6px;border-radius:3px}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column">
  <header style="height: 56px; background: #2B2F33; color: #fff; display: flex; align-items: center; padding: 0 24px">
    <span style="display: flex; align-items: center; gap: 10px" aria-label="Demo Banking" role="img">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h8.5a11 11 0 0 1 0 22H7z"></path><path d="M12 16h9"></path><path d="M17.5 12l4 4-4 4"></path></svg>
      <span style="font-size: 17px; letter-spacing: 0.04em" aria-hidden="true"><span style="font-weight: 600">DEMO</span> <span style="font-weight: 300">BANKING</span></span>
    </span>
  </header>
  <main style="flex: 1 1 auto; display: flex; justify-content: center; padding: 72px 16px">
    <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px">
      <h1 tabindex="-1" style="text-align: center">Sign in</h1>
      <form style="background: #fff; border-radius: 4px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
        <p role="alert" style="color: #C0362C; display: flex; gap: 8px; align-items: flex-start; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex: none; margin-top: 3px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>The username or password is incorrect.</p>
        <div class="field">
          <label class="label" for="u">Username</label>
          <input class="input" id="u" autocomplete="username" value="kenji">
        </div>
        <div class="field">
          <label class="label" for="p">Password</label>
          <input class="input" id="p" type="password" autocomplete="current-password" value="........">
        </div>
      </form>
      <div style="display: flex; justify-content: center"><button class="btn btn-primary" type="submit" style="min-width: 240px">Sign in</button></div>
      <div style="display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; background: #EAECEF; border-radius: 4px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6770" stroke-width="2" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
        <p class="sm">Demo credentials — username <code>[DEMO_USERNAME]</code>, password <code>[DEMO_PASSWORD]</code> (see README).</p>
      </div>
      <p class="xs muted" style="text-align: center">Demo Banking is an independent personal banking worksample.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
